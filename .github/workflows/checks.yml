# The checks that this project runs. CLAUDE.md section 4 lists the nine
# commands of the newest job, and that job runs them in the same order.
#
# The matrix has two axes, so each run holds four jobs:
#
# - The operating system is Linux or macOS. The tests read this machine through
#   the sysinfo crate, and that crate holds a separate implementation for each
#   operating system. macOS therefore needs a run of its own.
# - The release of Rust is the newest release or the oldest release. The newest
#   release is the release that rust-toolchain.toml names. The oldest release
#   is the release that the field `rust-version` of Cargo.toml names.
#
# The newest job runs every check. The oldest job compiles the workspace and
# runs the tests, and it runs nothing else. The output of clippy, of
# `cargo fmt`, and of rustdoc changes with the release, so the newest job alone
# holds those tools. ADR 0095 in docs/contributor/adr records this decision.
#
# Watch the cost of the macOS jobs. A macOS minute costs about ten times as much
# as a Linux minute. The `fail-fast` default limits that cost, because a failure
# on Linux cancels the macOS jobs. GitHub rounds the time of each job up to a
# whole minute, and each job installs the toolchain again.
#
# The workflow also publishes the documentation site from main. CLAUDE.md
# section 9 holds the rules of the site.
name: checks

on:
  push:
    branches: [main]
  pull_request:
  # The manual button on the Actions page. GitHub shows the button only after
  # this file reaches the default branch.
  workflow_dispatch:

# A new commit cancels the run of the commit before it. A branch that receives
# several commits together therefore costs the minutes of the last commit alone.
#
# This workflow never cancels a run on main. Such a run can publish the site, and
# a cancel could stop that deployment before it ends.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A warning from rustdoc fails the run. Cargo.toml sets
  # `broken_intra_doc_links = "warn"`, and a warning alone would pass.
  RUSTDOCFLAGS: -D warnings

jobs:
  checks:
    name: checks on ${{ matrix.os }} with the ${{ matrix.rust }} release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [newest, oldest]
    # The default limit is 360 minutes. A job that hangs would cost 6 hours.
    # macOS needs the larger part of this limit, because the `prometheus`
    # feature pulls in a dependency that builds C source.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The newest job. rust-toolchain.toml names the release, the profile, and
      # the components. This command reads that file, and it installs what the
      # file names. rustup then uses that release for every cargo command below.
      #
      # `--no-self-update` stops rustup from an update of itself. Homebrew
      # installs rustup on the macOS runner, and an update there is wrong.
      - name: Install the toolchain that rust-toolchain.toml names
        if: matrix.rust == 'newest'
        run: rustup toolchain install --no-self-update

      # The oldest job. The workspace declares `rust-version = "1.88"`. Cargo
      # checks nothing against that field, so the field is a statement and not a
      # fact. This step installs that release, and the jobs below turn the
      # statement into a fact.
      #
      # `RUSTUP_TOOLCHAIN` outranks rust-toolchain.toml, so the variable wins
      # over the pin. The step writes the variable to `GITHUB_ENV`, and every
      # later step of this job then uses the oldest release.
      #
      # The guard reads the number from Cargo.toml, and it compares that number
      # against the compiler that the job holds. The guard fails when the two
      # differ, and it fails when the pin takes the job over. Without the
      # guard the job could pass on the newest release and prove nothing.
      - name: Install the release that Cargo.toml declares
        if: matrix.rust == 'oldest'
        run: |
          set -eu
          declared=$(grep -m1 '^rust-version = ' Cargo.toml | cut -d'"' -f2)
          rustup toolchain install "$declared" --profile minimal --no-self-update
          echo "RUSTUP_TOOLCHAIN=$declared" >> "$GITHUB_ENV"
          actual=$(RUSTUP_TOOLCHAIN="$declared" rustc --version | cut -d' ' -f2)
          case "$actual" in
            "$declared" | "$declared".*) ;;
            *)
              echo "This job runs $actual. Cargo.toml declares $declared."
              exit 1
              ;;
          esac

      # The cache holds the Cargo home and the target directory. A run that
      # finds the cache does not compile the dependencies again. The action
      # gives each job a key of its own. The action reads the release of the
      # compiler for that key, so the steps above come first.
      - uses: Swatinem/rust-cache@v2

      # The three steps below belong to the oldest job. `cargo check` compiles
      # each example and each test target, and it runs no test. The two test
      # steps then run the tests. `--locked` makes Cargo return an error when
      # Cargo.lock is not current.
      - name: Check that the oldest release compiles the workspace
        if: matrix.rust == 'oldest'
        run: cargo check --locked --workspace --all-features --all-targets

      - name: Run the tests with the oldest release
        if: matrix.rust == 'oldest'
        run: cargo test --locked

      - name: Run the doc tests with the oldest release
        if: matrix.rust == 'oldest'
        run: cargo test --locked --doc

      # The steps below belong to the newest job. They run in the order of their
      # cost. A cheap step that fails stops the run, and the expensive steps
      # never start.
      - name: Confirm that each check of the lint script works
        if: matrix.rust == 'newest'
        run: python3 scripts/ste-lint.py --selftest

      - name: Find the common faults of Simplified Technical English
        if: matrix.rust == 'newest'
        run: python3 scripts/ste-lint.py

      - name: Check the format
        if: matrix.rust == 'newest'
        run: cargo fmt --check

      - name: Run clippy
        if: matrix.rust == 'newest'
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run the tests
        if: matrix.rust == 'newest'
        run: cargo test

      - name: Run the doc tests
        if: matrix.rust == 'newest'
        run: cargo test --doc

      - name: Build the documentation
        if: matrix.rust == 'newest'
        run: cargo doc --no-deps

      # The documentation site. CLAUDE.md section 9 holds its rules. The site
      # does not depend on the operating system or on the release, so these
      # steps run for Linux with the newest release alone. They come after the
      # step above, because the site build reads the output of
      # `cargo doc --no-deps`.
      - name: Install mdBook
        if: runner.os == 'Linux' && matrix.rust == 'newest'
        uses: taiki-e/install-action@v2
        with:
          # flake.lock pins the same release for the shell of the flake.
          # CLAUDE.md section 9 states how to keep the two equal.
          tool: mdbook@0.5.4

      - name: Confirm that the generated files of the site are current
        if: runner.os == 'Linux' && matrix.rust == 'newest'
        run: cargo xtask site check

      - name: Build the site
        if: runner.os == 'Linux' && matrix.rust == 'newest'
        run: cargo xtask site build

      # A pull request builds the site, so a fault reaches the reviewer. Only a
      # run on main uploads the site, and the job `deploy` publishes it.
      - name: Upload the site
        if: >-
          runner.os == 'Linux' && matrix.rust == 'newest'
          && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/book

  # This job publishes the site that the Linux job with the newest release
  # uploaded. It waits for each job of the matrix, so a fault on macOS or with
  # the oldest release also stops the deployment.
  deploy:
    name: publish the site
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # These two permissions belong to this job alone. `pages: write` lets the
    # job replace the site. `id-token: write` lets the job prove to GitHub Pages
    # that the request comes from this workflow.
    permissions:
      pages: write
      id-token: write
    # The environment `github-pages` accepts a deployment from main alone.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
